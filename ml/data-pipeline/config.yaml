# MLECU corpus pipeline — source registry + pipeline config.
# All tunables live here; domain logic stays out of code (Hardware Parser convention).

pipeline:
  data_dir: data
  # user_agent_pool: [ "..." ]   # defaults to a generic browser UA

state:
  db_path: data/corpus.sqlite
  gone_after_misses: 3

gates:
  min_chars: 40
  require_alpha: true

notify:                           # Discord run summary — set DISCORD_WEBHOOK_URL in secrets.env
  enabled: true
  discord_webhook_env: DISCORD_WEBHOOK_URL
  only_when_new: false            # false = ping every run (liveness heartbeat); true = only when new

sources:
  romraider_defs:
    enabled: true
    repo_url: https://github.com/RomRaider/SubaruDefs.git
    local_path: data/raw/SubaruDefs
    auto_update: true             # periodic runs git-pull fresh defs
    ecuflash_subdirs:
      - "ECUFlash/subaru standard"
      - "ECUFlash/subaru metric"
    # only_models: ["Forester", "Impreza WRX STI"]   # optional model filter

  romraider_logger:               # SSM2 telemetry schema (feeds car/logging)
    enabled: true
    local_path: data/raw/SubaruDefs
    logger_file: "RomRaider/logger/standard/logger.xml"

  rusefi_docs:                    # open engine-management theory (general)
    enabled: true
    repo_url: https://github.com/rusefi/rusefi_documentation.git
    local_path: data/raw/rusefi_documentation
    auto_update: true
    min_chars: 200

  forum_legacygt:                 # EJ20X-swap reasoning threads (IPS; uses patchright/JS path)
    enabled: true
    rate_limit_per_min: 20
    max_pages: 12
    seed_threads:
      - https://www.legacygt.com/topic/131452-ej20x-base-map-after-swap/
      - https://www.legacygt.com/topic/104127-base-map-needed/
      - https://www.legacygt.com/topic/142813-ej20x-swap/
      - https://www.legacygt.com/topic/105666-ej20x-swap/
      - https://www.legacygt.com/topic/131744-legacy-gt-ej20xy-swap/
    # discovery — bounded crawl of subforum listings for NEW matching threads (passive accumulation)
    discover_forums:
      - https://www.legacygt.com/forum/65-tuning/                              # tuning-specific (high yield)
      - https://www.legacygt.com/forum/8-fourth-generation-legacy-2005-2009/   # general 4th-gen (swap threads)
    discover_max_pages: 8         # walk DEEPER for coverage/backfill of EXISTING threads (skip-known dedups)
    discover_max_new: 8           # cap NEW threads fetched per run (bounded)
    # Discovery takes a thread iff its TITLE matches >=1 keyword AND no reject term. The subforum
    # scope already limits to Subaru EJ tuning; the LLM judge does the deep EJ25-vs-EJ20X relevance.
    discover_keywords:
      - ej20x
      - ej20y
      - ej20
      - ej255
      - ej257
      - ej25
      - spec b
      - swap
      - tune
      - tuning
      - base map
      - basemap
      - ots map
      - fuel map
      - romraider
      - accessport
      - cobb
      - ecutek
      - dyno
      - knock
      - fueling
      - fuel trim
      - closed loop
      - open loop
      - boost target
      - boost control
      - wastegate
      - injector
      - timing
      - afr
      - stage 1
      - stage 2
      # platform chassis codes + diagnostic/logging terms (recall for clearly in-domain threads)
      - lgt
      - legacy gt
      - obxt
      - datalog
      - logging
      - vacuum leak
      - boost leak
      - correction
      - learning
      - dam
      - fkl
      - iam
      - maf
      - idle
    discover_reject_keywords: ["for sale", "fs:", "f/s", "wtb", "group buy", "gb:", "raffle", "for trade", "ft:", "meet", "gtg", "sold"]
    # discover_keywords: [...]    # defaults to ej20x/swap/tune/boost/knock/... (see the source)

  local_pdf:                      # owner-supplied PDFs — drop files under data/raw/pdfs/{fsm,books}/
    enabled: true
    base_dir: data/raw/pdfs
    collections:
      fsm:   { kind: fsm_spec, domain: subaru }
      books: { kind: theory,   domain: general }

  ecu_docs:                       # EFI-reference manuals (reference tier) — PRIVATE corpus use only
    enabled: true
    rate_limit_per_min: 30
    doc_sets:
      - name: megamanual          # MegaSquirt MegaManual fundamentals (public HTML, copyrighted)
        base_url: https://www.megamanual.com/v22manual/
        kind: efi_reference
        domain: general
        min_chars: 600
        pages: [ mfuel.htm, vetable.htm, mtune.htm, minj.htm ]
      - name: obd_pids            # SAE J1979 OBD-II PIDs — the UNIVERSAL channel vocabulary anchor
        base_url: https://en.wikipedia.org/wiki/
        kind: efi_reference
        domain: general
        min_chars: 600
        pages: [ OBD-II_PIDs ]
      # rusEFI already covered by rusefi_docs; vendor PDFs via local_pdf.

  # ---- universal-first source expansion (2026-07-03) --------------------------------
  # One generic phpBB engine serves three boards. Universal keyword set for the general
  # boards; Subaru set for romraider. Bounded discovery, conservative rates.

  forum_speeduino:                # speeduino.com — universal open-EFI reasoning (phpBB)
    enabled: true
    rate_limit_per_min: 15
    base_url: https://speeduino.com/forum
    domain: general
    discover_forums: [3, 18]      # General Discussion/Support/Projects; Getting started
    discover_max_pages: 3
    discover_max_new: 6
    max_thread_pages: 8
    discover_keywords: &universal_tuning_kws
      - tune
      - tuning
      - ve table
      - volumetric
      - afr
      - air fuel
      - wideband
      - lambda
      - o2
      - ego
      - timing
      - ignition
      - advance
      - knock
      - idle
      - iac
      - warmup
      - wue
      - accel
      - enrich
      - injector
      - dead time
      - latency
      - req_fuel
      - reqfuel
      - maf
      - map sensor
      - speed density
      - boost
      - wastegate
      - closed loop
      - open loop
      - trim
      - cranking
      - fuel pressure
      - dyno
      - datalog
      - fuel map

  forum_msextra:                  # msextra.com — MegaSquirt tuning theory (phpBB)
    enabled: true
    rate_limit_per_min: 15
    base_url: https://www.msextra.com/forums
    domain: general
    discover_forums: [134, 131, 101, 122]   # Tuning; MS3 General; MS2/Extra; TunerStudio
    discover_max_pages: 3
    discover_max_new: 6
    max_thread_pages: 8
    discover_keywords: *universal_tuning_kws

  forum_romraider:                # romraider.com — Subaru tuning/logging/defs + stock-ROM threads (phpBB)
    enabled: true
    rate_limit_per_min: 15
    base_url: https://www.romraider.com/forum
    domain: subaru
    seed_threads:
      - https://www.romraider.com/forum/viewtopic.php?f=15&t=15258   # 2005 Forester XT 4EAT stock ROM map
    discover_forums: [15, 51, 8, 32]  # Subaru Tuning; EMS Analysis&Tuning; ECU/Logger Defs; Tuning Utilities
    discover_max_pages: 3
    discover_max_new: 8
    max_thread_pages: 10
    discover_keywords:
      - rom
      - tune
      - tuning
      - knock
      - afr
      - boost
      - idle
      - maf
      - injector
      - timing
      - learning
      - logger
      - definition
      - dyno
      - wideband
      - forester
      - wrx
      - sti
      - legacy
      - fxt
      - stock
      - datalog
      - avcs
      - tgv
    # ROM *attachments* need a logged-in account — Syed downloads binaries manually into
    # data/raw/roms/ (gitignored); this source captures the thread text/metadata.

  forum_nasioc:                   # forums.nasioc.com — vBulletin behind HARD Cloudflare
    # Source is built + tested, but NASIOC's managed challenge doesn't clear headless (verified
    # 2026-07-03, even with the challenge-retry loop). Revisit: one-time non-headless run to seed
    # CF cookies into a persistent context, or import cookies from Syed's browser.
    enabled: false
    rate_limit_per_min: 12
    base_url: https://forums.nasioc.com/forums
    seed_threads:
      - https://forums.nasioc.com/forums/showthread.php?t=2882357    # 05 Forester XT build help
    discover_forums: []           # fill after a BrowserFetcher probe of forumdisplay ids
    discover_max_pages: 2
    discover_max_new: 6
    max_thread_pages: 8
    discover_keywords: *universal_tuning_kws

  tunerstudio_ini:                # speeduino.ini — CROSS-PLATFORM table vocabulary (reference tier)
    enabled: true
    repo_url: https://github.com/speeduino/speeduino.git
    local_path: data/raw/speeduino
    ini_path: reference/speeduino.ini
    auto_update: true
