# MLECU corpus pipeline — source registry + pipeline config.
# All tunables live here; domain logic stays out of code (Hardware Parser convention).

pipeline:
  data_dir: data
  # user_agent_pool: [ "..." ]   # defaults to a generic browser UA

state:
  db_path: data/corpus.sqlite
  gone_after_misses: 3

gates:
  min_chars: 40
  require_alpha: true

sources:
  romraider_defs:
    enabled: true
    repo_url: https://github.com/RomRaider/SubaruDefs.git
    local_path: data/raw/SubaruDefs
    auto_update: false            # already cloned; set true to `git pull` each run
    ecuflash_subdirs:
      - "ECUFlash/subaru standard"
      - "ECUFlash/subaru metric"
    # only_models: ["Forester", "Impreza WRX STI"]   # optional model filter

  romraider_logger:               # SSM2 telemetry schema (feeds car/logging)
    enabled: true
    local_path: data/raw/SubaruDefs
    logger_file: "RomRaider/logger/standard/logger.xml"

  rusefi_docs:                    # open engine-management theory (general)
    enabled: true
    repo_url: https://github.com/rusefi/rusefi_documentation.git
    local_path: data/raw/rusefi_documentation
    auto_update: false
    min_chars: 200

  forum_legacygt:                 # EJ20X-swap reasoning threads (IPS; uses patchright/JS path)
    enabled: true
    rate_limit_per_min: 20
    max_pages: 12
    seed_threads:
      - https://www.legacygt.com/topic/131452-ej20x-base-map-after-swap/
      - https://www.legacygt.com/topic/104127-base-map-needed/
      - https://www.legacygt.com/topic/142813-ej20x-swap/
      - https://www.legacygt.com/topic/105666-ej20x-swap/
      - https://www.legacygt.com/topic/131744-legacy-gt-ej20xy-swap/

  forum_nasioc:    { enabled: false, rate_limit_per_min: 20 }
