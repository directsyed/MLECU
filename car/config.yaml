# car/ecutune — safety limits + engine constants. Syed reviews these NUMBERS (they are
# safety-critical ceilings). Code reads them via ecutune.core.config.load_config().

safety:
  max_ve_step: 0.03            # +/-3% max fuel/VE change per iteration (the provable bound)
  afr_floor: 11.5              # AFR leaner than this at boost => abort the leaning edits (lambda ~0.78)
  # Which fuel-target CELLS clamp_afr_floor treats as boost. NOT a boost limit and not a
  # "stay out of boost" setting -- it only decides where the AFR floor is enforced.
  # 1.5 was a pre-data placeholder. Measured on this car (six drives, 2026-08-26/27): MAP
  # crosses atmospheric at ~0.6 g/rev, and all 31 knock events sat at 0.58-0.79 g/rev, i.e.
  # ENTIRELY OUTSIDE the old threshold. The failure is one-sided: too high leaves real boost
  # cells unprotected; too low protects vacuum cells whose 14.7 target is nowhere near the
  # 11.5 floor, so the clamp simply never fires there. Ratified by Syed 2026-08-27.
  boost_load_threshold: 0.60   # load (g/rev) above which a fuelling cell counts as "boost"
  boost_trim_tol: 0.05         # trims must be within +/-5% before boost edits ungate
  fuel_trim_converged_tol: 0.05  # |trim| under this counts as converged (fuel-before-timing gate)
  steady_tol: 0.05

  # --- sensor recalibration (2026-08-27) — SYED REVIEWS THESE NUMBERS ---------------
  # A sensor calibration is bounded by evidence and displacement, NOT by the +/-3%/iteration
  # velocity limit above (that one is for chasing a moving fuel target; a MAF curve is a
  # measurement that is simply wrong by a fixed amount). Measured worst point on the car is
  # +36.3%, so 0.40 is a real ceiling with margin.
  max_sensor_recal: 0.40         # per-iteration cap, measured against the CURRENT table
  sensor_envelope: 0.40          # CUMULATIVE cap, measured against the archived STOCK ROM.
                                 # Step bounds do not bound distance; without this, enough small
                                 # iterations walk the curve arbitrarily far. Ratified 2026-08-30.

  # Ratified 2026-08-30: moved out of the pydantic defaults, whose own comment said these were
  # "SYED'S TO RATIFY" and never had been. No behaviour change -- same numbers, now visible.
  belief_envelope:
    fuel.injector_flow: 0.25     # +/-25% of the build-sheet ~500 cc/min
    fuel.injector_latency: 0.30  # +/-30% of the stock dead time
    sensor.maf_transfer: 0.20    # fuel-path only; the sensor path uses sensor_envelope above
  belief_envelope_default: 0.25
  min_sensor_samples: 20         # steady log samples required before a breakpoint may move
  sensor_require_monotonic: true # corrected curve must stay strictly ascending
  default_timing_ceiling: 25.0   # deg BTDC; used when no per-rpm override matches

  # --- ignition timing stage (2026-08-30) — SYED REVIEWS THESE NUMBERS ----------------
  # Syed's ruling, 2026-08-30: 6 deg per iteration, re-log between passes. This is the
  # ONLY thing bounding how fast timing moves -- ve_rate_limit is fuel-only. Note it takes
  # 4 iterations to reach the ratified ceiling at the worst cell (18.12 deg at 2400 rpm /
  # 0.85 g/rev), which is the intended cost of being able to watch each step on the car.
  max_timing_step: 6.0           # deg, per iteration, against the table's CURRENT value

  # CUMULATIVE floor, measured against the archived STOCK ROM. The ceilings bound how much
  # ADVANCE a cell may carry; nothing bounded how much RETARD could accumulate, and a
  # sustained wrong diagnosis at 6 deg/iteration walks the whole map to zero in four passes.
  # Heavy retard does not detonate -- it dumps heat into the turbine, and this car is fully
  # catless with no EGT sensor, so there is no instrument that would catch it.
  # DERIVATION, not a guess: the largest retard the ratified ceilings THEMSELVES demand is
  # 18.117 deg (stock 40.12 at 2400 rpm / 0.85 g/rev against the 22 deg boost ceiling), so
  # anything below ~18.2 would fight the ceilings. 20.0 clears that with ~1.9 deg of
  # evidence-driven headroom and still refuses a runaway.  ** RATIFY OR CHANGE THIS **
  max_timing_retard: 20.0        # deg below stock, cumulative, per cell

  # ABSOLUTE last-resort floor, independent of any baseline. max_timing_retard goes INERT when
  # no archived stock ROM is supplied (the same "inert without a baseline" pattern as
  # belief_envelope and sensor_envelope), and the ceiling is a MAXIMUM -- so with no baseline
  # there was nothing at all stopping repeated iterations walking a cell past 0 deg and on into
  # after-TDC territory. Found 2026-08-30 by the convergence property test, not by inspection.
  # This is NOT the tuning limit -- the ceiling, the cumulative floor and the 6 deg rate cap are
  # -- it is the bound that says "no legitimate ignition-retard stage ever fires after TDC".
  # The stock map's own minimum is 2.148 deg.
  min_timing_advance: 0.0        # deg BTDC; a clamp may never take a cell below this

  # --- IAM deficit: BOTH of these are FALLBACKS ONLY ---------------------------------
  # IAM scales the advance the ECU adds ABOVE the base map, so a cell that logged no knock
  # while IAM was collapsed is not proven safe -- it ran with that advance already withdrawn
  # and gets it back when IAM recovers. Both halves of that sum are READ FROM THE ROM when the
  # ROM exposes them, which for this car it does:
  #   authority per cell <- "Knock Correction Advance Max" (0xC8FB0). On this ROM it is 0.0
  #       across the ENTIRE idle and cruise region (load <= 0.55) and 3.16-9.14 deg where the
  #       car makes boost. The 2.0 flat constant below was therefore retarding the validated
  #       knock-free idle band while UNDER-correcting the boost cells that needed it.
  #   reference       <- "Advance Multiplier (Initial)" = 0.5, NOT 1.0. An observed IAM of
  #       0.500 is this calibration's FACTORY value, not a halved one (the step is 0.25).
  #       Measuring from a hardcoded 1.0 would invent a permanent 50% deficit on a healthy
  #       engine -- and the 2026-08-26 analysis did read 0.500 as "already halved".
  # These two are used only when a ROM does not expose those tables (another platform, or a
  # def that lacks them). Applied from the drive's WORST IAM, never a per-cell mean: IAM is
  # global, so a per-cell mean encodes only WHEN in the drive each cell was visited.
  iam_advance_authority_deg: 2.0   # fallback deg of advance authority when the ROM has no map
  iam_reference: 1.0               # fallback healthy IAM when the ROM has no initial value
  # Per-row timing ceilings — PLACEHOLDER values, tighten under load. REVIEW before any
  # timing work (EJ20X on 93 oct wants less than the EJ255 base assumes). Not exercised by
  # the idle (fuel-only) convergence loop.
  # RPM-keyed ceiling. Set generously on purpose: this car legitimately runs 40-45 deg at
  # light cruise, so an rpm-only limit tight enough to protect boost would gut the cruise map.
  # LOAD is the axis that separates those cases, so it is the primary limit below.
  timing_ceilings:
    - {rpm: 0,    max_advance: 46.0}
    - {rpm: 4500, max_advance: 40.0}
    - {rpm: 6000, max_advance: 32.0}

  # LOAD-keyed ceiling — the primary timing limit. Ratified by Syed 2026-08-30.
  # Effective ceiling = min(rpm limit, load limit), so this can only tighten.
  #   < 0.55  cruise; the map's 40-45 deg here is normal and the car is not knocking
  #   0.55+   the ECU currently DELIVERS 33.6 deg here and still pulls ~5 deg of knock
  #   0.85+   boost region; EJ20X is 9.5:1 against the EJ255 map's 8.4:1, on 93 octane
  timing_ceilings_by_load:
    - {load: 0.00, max_advance: 45.0}
    - {load: 0.55, max_advance: 30.0}
    - {load: 0.85, max_advance: 22.0}

engine:
  stoich: 14.7
  displacement_l: 2.0          # EJ20X truth (base ROM assumes 2.5L EJ255)

algo:
  kp: 0.5                      # correct ~half the trim error per step
  ki: 0.05                     # small integral: kills residual error without winding up
  damping: 0.7                 # <1 => small deliberate steps, low overshoot
  step_clamp: 0.03             # == safety.max_ve_step (the clamp IS the anti-windup)
  sensor_deadband: 0.02        # measured corrections under +/-2% are noise: emit no edit
  max_iters: 30
